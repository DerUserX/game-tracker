<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12162a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Game Release Tracker</title>
<style>
  :root {
    --bg: #12162a; --surface: #1a1f36; --card: #232a45; --border: #2f3757;
    --text: #e8ecf8; --muted: #8f97b5; --subtle: #5f6788;
    --accent: #4a90e2; --gold: #f5c542; --hype-bg: #2c2816; --hype-border: #d9a520;
    /* Countdown-Pill in Kartenfarbe (Hype gold, sonst blau); Dringlichkeit nur als Kontur */
    --pill-hype-bg: #4a3714; --pill-hype: #f5b14a; --pill-std-bg: #1d3352; --pill-std: #6cb0ff;
    --outline-today: #5ee08f; --outline-soon: #ff8a1f;
    /* Countdown: Gold/Orange gehört nur den gehypten Spielen */
    --warn: #f5b14a; --trophy: #5aa9ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; overflow-x: hidden;
         padding-bottom: env(safe-area-inset-bottom); }

  header { position: sticky; top: 0; z-index: 10; background: var(--surface);
           padding: calc(14px + env(safe-area-inset-top)) 16px 0; }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .reload { background: var(--card); border: 0; color: var(--text); width: 36px; height: 36px;
            border-radius: 10px; font-size: 1.05rem; cursor: pointer; flex-shrink: 0; }
  .reload.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 12px 0 0;
          background: var(--bg); border-radius: 10px; padding: 3px; }
  .tabs button { position: relative; z-index: 1; border: 0; background: none; color: var(--muted);
                 font: inherit; font-weight: 700; font-size: .78rem; padding: 9px 2px; cursor: pointer;
                 white-space: nowrap;
                 transition: color .2s; }
  .tabs button.active { color: #fff; }
  .tabs .indicator { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(33.333% - 2px);
                     background: var(--accent); border-radius: 8px; transition: transform .3s ease; }
  .tabs-wrap { padding-bottom: 10px; }

  .viewport { overflow: hidden; }
  /* align-items: flex-start → jede Seite nur so hoch wie ihr Inhalt; die Höhe des Viewports
     folgt per fitHeight() der aktiven Seite (sonst Leerraum unter der kürzeren Liste) */
  .track { display: flex; align-items: flex-start; width: 300%; transition: transform .3s ease; }
  .page { width: 33.3333%; flex-shrink: 0; padding: 10px 12px 24px; }
  .year { display: flex; align-items: center; gap: 10px; margin: 14px 4px 4px; }
  .year:first-child { margin-top: 2px; }
  .year .label { font-weight: 700; font-size: .95rem; }
  .year .line { flex: 1; height: 1px; background: var(--border); }
  .year .count { font-size: .7rem; color: var(--subtle); }
  .view-toggle { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 8px;
                 font-size: .72rem; color: var(--muted); }
  .view-toggle input { accent-color: var(--accent); margin: 0; }

  .game { display: flex; gap: 12px; background: var(--card); border-radius: 12px; padding: 10px;
          margin: 8px 0; border: 2px solid transparent; }
  .game.hyped { background: var(--hype-bg); border-color: var(--hype-border); }
  .cover { width: 54px; height: 72px; border-radius: 8px; flex-shrink: 0; object-fit: cover;
           background: linear-gradient(160deg, #2b3354, #3a4470); display: flex; align-items: center;
           justify-content: center; color: #8c96b9; font-weight: 700; font-size: 1.3rem; }
  .info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .name-row { display: flex; align-items: flex-start; gap: 6px; }
  .name { font-weight: 700; font-size: 1rem; line-height: 1.25; flex: 1; }
  .game.hyped .name { color: var(--gold); }
  .badge { font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .badge.tba { background: var(--border); color: var(--muted); }
  .badge.trophy { background: #1b2f4d; color: var(--trophy); text-decoration: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: .68rem; padding: 2px 6px; border-radius: 5px; background: var(--border); color: var(--muted); }
  .chip.ps { background: #1d3557; color: #9cc7ff; }
  .pill { align-self: flex-start; font-size: .76rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
          background: var(--pill-std-bg); color: var(--pill-std); }
  .game.hyped .pill { background: var(--pill-hype-bg); color: var(--pill-hype); }
  .pill.today { box-shadow: inset 0 0 0 2px var(--outline-today); }
  .pill.soon { box-shadow: inset 0 0 0 2px var(--outline-soon); }

  .gap { display: flex; align-items: center; gap: 8px; margin: 2px 6px; }
  .gap .line { flex: 1; height: 1px; background: var(--border); }
  .gap .txt { font-size: .68rem; color: var(--subtle); white-space: nowrap; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty .icon { font-size: 2.4rem; }
  .footer { text-align: center; color: var(--subtle); font-size: .72rem; padding: 4px 16px 20px; }
  .footer.warn { color: var(--warn); }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <div>
      <h1>Meine Hype Games</h1>
      <div class="sub" id="sub">Lade…</div>
    </div>
    <button class="reload" id="reload" aria-label="Neu laden">⟳</button>
  </div>
  <div class="tabs-wrap">
    <div class="tabs" role="tablist">
      <div class="indicator" id="indicator"></div>
      <button id="tab0" class="active" role="tab">📅 Mit Datum</button>
      <button id="tab1" role="tab">⏳ Ohne Datum</button>
      <button id="tab2" role="tab">🗄 Archiv</button>
    </div>
    <label class="view-toggle"><input type="checkbox" id="byYear"> nach Jahren</label>
  </div>
</header>

<div class="viewport" id="viewport">
  <div class="track" id="track">
    <div class="page" id="page0"></div>
    <div class="page" id="page1"></div>
    <div class="page" id="page2"></div>
  </div>
</div>
<div class="footer" id="footer"></div>

<script>
const GIST_RAW_URL = "https://gist.githubusercontent.com/demuHB/6223c6e0ef9f2d6f85060d161a4650e1/raw/games.json";
// Lokales Testen: index.html?src=games.json
const SOURCE = new URLSearchParams(location.search).get('src') || GIST_RAW_URL;
const COVER_URL = id => `https://images.igdb.com/igdb/image/upload/t_cover_big/${id}.jpg`;

const PAGES = 3;
let games = [], page = 0;
let byYear = false;
try { byYear = localStorage.getItem('byYear') === '1'; } catch (e) {}
const $ = id => document.getElementById(id);

// ---------- Helfer ----------
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function parseDate(s) {
  if (!s) return null;
  const m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  const d = m ? new Date(+m[3], +m[2] - 1, +m[1]) : new Date(s);
  return isNaN(d) ? null : d;
}
function daysUntil(s) {
  const target = parseDate(s);
  if (!target) return null;
  const now = new Date(); now.setHours(0,0,0,0); target.setHours(0,0,0,0);
  return Math.round((target - now) / 86400000);
}
function effectiveDate(g) {
  if (g.release_date) return parseDate(g.release_date);
  if (g.release_window) {
    const [season, year] = g.release_window.split(' ');
    const start = { 'Frühling': [2,20], 'Sommer': [5,21], 'Herbst': [8,23], 'Winter': [11,21] }[season];
    if (start && year) return new Date(+year, start[0], start[1]);
  }
  return parseDate(g.last_known_date);
}
// ohne genaues Datum: von Hand markiert, gar kein Datum oder nur Jahr/Quartal/Monat bekannt
const isTba = g => !!(g.manual_tba || !g.release_date || g.release_window);
function releaseYear(g) {
  const m = (g.release_window || '').match(/\d{4}/);
  if (m) return +m[0];
  const d = parseDate(g.release_date) || parseDate(g.last_known_date);
  return d ? d.getFullYear() : null;
}
const sortByDate = (a, b) => (effectiveDate(a) || new Date(9999,0)) - (effectiveDate(b) || new Date(9999,0));
const weeks = d => `${Math.round(d / 7 * 2) / 2} Wochen`;

// Plattform-Formatierung (wie in der PC-App)
const SHORT = { 'PlayStation 5':'PS5', 'PlayStation 4':'PS4', 'PlayStation 3':'PS3', 'Nintendo Switch 2':'Switch 2',
                'Nintendo Switch':'Switch', 'PlayStation VR2':'PS VR2' };
function platformList(str) {
  if (!str) return [];
  let list = [];
  for (let p of str.split(',').map(s => s.trim()).filter(Boolean)) {
    const low = p.toLowerCase();
    if (low.includes('xbox')) continue;
    if (low.includes('microsoft windows')) p = 'PC';
    if (!list.includes(p)) list.push(p);
  }
  if (list.some(p => p.toLowerCase().includes('switch 2')))
    list = list.filter(p => !(p.toLowerCase().endsWith('switch') && !p.toLowerCase().includes('switch 2')));
  const key = n => { n = n.toLowerCase(); return n.includes('playstation 5') ? 0 : n.includes('switch 2') ? 1 : n === 'pc' ? 2 : 3; };
  return list.sort((a, b) => key(a) - key(b) || a.localeCompare(b));
}

function countdown(g) {
  // zweiter Wert = Kontur-Klasse ('' = keine Kontur)
  if (g.release_window && !g.archived) return [`📆 ${g.release_window}`, ''];
  if (g.manual_tba) return [g.last_known_date ? `Platzhalter ignoriert: ${g.last_known_date}` : 'Datum unbekannt', ''];
  if (g.release_date) {
    const d = daysUntil(g.release_date);
    if (d === null) return ['Datum unbekannt', ''];
    const date = g.release_date;
    if (d < 0) return [`Erschienen vor ${-d} ${d === -1 ? 'Tag' : 'Tagen'} · ${date}`, ''];
    if (d === 0) return [`🎉 Heute! · ${date}`, 'today'];
    if (d <= 7) return [`🔥 Noch ${d} ${d === 1 ? 'Tag' : 'Tage'} · ${date}`, 'soon'];
    return [`Noch ${d} Tage (${weeks(d)}) · ${date}`, ''];
  }
  if (g.release_window) return [`~ ${g.release_window}`, ''];
  return ['Datum unbekannt', ''];
}

// ---------- Rendering ----------
function gameHtml(g) {
  const name = g.display_name || g.name;
  const initial = esc((name || '?').charAt(0).toUpperCase());
  const cover = g.cover_id
    ? `<img class="cover" loading="lazy" src="${COVER_URL(esc(g.cover_id))}" alt=""
            onerror="this.outerHTML='<div class=&quot;cover&quot;>${initial}</div>'">`
    : `<div class="cover">${initial}</div>`;
  const chips = platformList(g.platforms)
    .map(p => `<span class="chip${p.toLowerCase().includes('playstation') ? ' ps' : ''}">${esc(SHORT[p] || p)}</span>`).join('');
  const [text, level] = countdown(g);
  const badges = (g.manual_tba ? '<span class="badge tba">TBA</span>' : '') +
                 (g.psn_trophy_count
                   ? (/^https:\/\/www\.exophase\.com\//.test(g.exophase_url || '')
                      ? `<a class="badge trophy" href="${esc(g.exophase_url)}" target="_blank" rel="noopener" title="${esc({psn: 'PlayStation-Trophäen', steam: 'Steam-Erfolge', xbox: 'Xbox-Erfolge'}[g.exophase_platform || 'psn'] || '')}">🏆 ${+g.psn_trophy_count} ↗</a>`
                      : `<span class="badge trophy">🏆 ${+g.psn_trophy_count}</span>`)
                   : '');
  return `<div class="game${g.hyped ? ' hyped' : ''}">
    ${cover}
    <div class="info">
      <div class="name-row"><div class="name">${g.hyped ? '★ ' : ''}${esc(name)}</div>${badges}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      <div class="pill${level ? ' ' + level : ''}">${esc(text)}</div>
    </div>
  </div>`;
}

function gapHtml(days, approx) {
  const txt = (approx ? '~ ' : '') + (days === 1 ? '1 Tag' : `${days} Tage`);
  return `<div class="gap"><div class="line"></div><div class="txt">${txt}</div><div class="line"></div></div>`;
}

function emptyHtml(text) {
  return `<div class="empty"><div class="icon">⏳</div><div>${text}</div></div>`;
}

function yearHtml(year, count) {
  return `<div class="year"><span class="label">${year || 'Ohne Jahr'}</span><span class="line"></span>` +
         `<span class="count">${count} ${count === 1 ? 'Spiel' : 'Spiele'}</span></div>`;
}

// Liste mit Tagesabständen; in der Jahres-Ansicht stattdessen Überschriften an Jahresgrenzen
function listHtml(list, withGaps) {
  const years = list.map(releaseYear);
  const perYear = years.reduce((m, y) => (m[y] = (m[y] || 0) + 1, m), {});
  let html = '';
  list.forEach((g, i) => {
    if (byYear && (i === 0 || years[i] !== years[i - 1])) {
      html += yearHtml(years[i], perYear[years[i]]);
    } else if (withGaps && i > 0) {
      const d1 = effectiveDate(list[i - 1]), d2 = effectiveDate(g);
      if (d1 && d2) {
        const gap = Math.abs(Math.round((d2 - d1) / 86400000));
        if (gap > 0) html += gapHtml(gap, false);
      }
    }
    html += gameHtml(g);
  });
  return html;
}

function render() {
  const active = games.filter(g => !g.archived);
  const dated = active.filter(g => !isTba(g)).sort(sortByDate);
  const tba = active.filter(isTba).sort(sortByDate);
  const archive = games.filter(g => g.archived).sort((a, b) => sortByDate(b, a));

  const archivedText = archive.length ? ` · ${archive.length} im Archiv` : '';
  $('sub').textContent = `${active.length} Spiele · ${active.filter(g => g.hyped).length} gehypt${archivedText}`;
  $('tab0').textContent = `📅 Mit Datum (${dated.length})`;
  $('tab1').textContent = `⏳ Ohne Datum (${tba.length})`;
  $('tab2').textContent = `🗄 Archiv (${archive.length})`;

  $('page0').innerHTML = listHtml(dated, true) || emptyHtml('Keine Spiele mit Datum');
  $('page1').innerHTML = listHtml(tba, false) || emptyHtml('Keine Spiele ohne Datum');
  $('page2').innerHTML = listHtml(archive, true) || emptyHtml('Archiv ist leer');
  fitHeight();
}

// Viewport genau so hoch wie die aktive Seite (both=true: beim Wischen beide Seiten sichtbar lassen)
function fitHeight(both) {
  const heights = [...Array(PAGES).keys()].map(i => $('page' + i).offsetHeight);
  const h = both ? Math.max(...heights) : heights[page];
  $('viewport').style.height = h + 'px';
}
window.addEventListener('resize', () => fitHeight());

function show(p) {
  const changed = p !== page;
  page = p;
  for (let i = 0; i < PAGES; i++) $('tab' + i).classList.toggle('active', p === i);
  $('indicator').style.transform = `translateX(${p * 100}%)`;
  $('track').style.transform = `translateX(-${p * 100 / PAGES}%)`;
  fitHeight();
  if (changed) window.scrollTo({ top: 0 });   // nur beim Seitenwechsel nach oben, nicht beim Zurückfedern
}

// ---------- Daten ----------
function load() {
  $('reload').classList.add('spin');
  fetch(SOURCE + (SOURCE.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      games = data;
      try { localStorage.setItem('games', JSON.stringify(data)); } catch (e) {}
      $('footer').className = 'footer';
      $('footer').textContent = 'Stand: ' + new Date().toLocaleString('de-DE');
      render();
    })
    .catch(() => {
      try { games = JSON.parse(localStorage.getItem('games') || '[]'); } catch (e) { games = []; }
      $('footer').className = 'footer warn';
      $('footer').textContent = '⚠️ Offline – letzter bekannter Stand';
      render();
    })
    .finally(() => $('reload').classList.remove('spin'));
}

for (let i = 0; i < PAGES; i++) $('tab' + i).onclick = () => show(i);
$('byYear').checked = byYear;
$('byYear').onchange = e => {
  byYear = e.target.checked;
  try { localStorage.setItem('byYear', byYear ? '1' : '0'); } catch (err) {}
  render();
};
$('reload').onclick = load;
load();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// Countdown bei Rückkehr zur App neu berechnen
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

// ---------- Swipe zwischen den Seiten ----------
const track = $('track'), indicator = $('indicator');
let startX = 0, startY = 0, dragging = false, horizontal = null;

document.addEventListener('touchstart', e => {
  startX = e.changedTouches[0].screenX; startY = e.changedTouches[0].screenY;
  dragging = true; horizontal = null;
  track.style.transition = indicator.style.transition = 'none';
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!dragging) return;
  const dx = e.changedTouches[0].screenX - startX, dy = e.changedTouches[0].screenY - startY;
  if (horizontal === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
    horizontal = Math.abs(dx) > Math.abs(dy);
    if (horizontal) fitHeight(true);   // während des Wischens die andere Seite nicht abschneiden
  }
  if (!horizontal) return;
  const step = 100 / PAGES, last = -(PAGES - 1) * step;      // eine Seite = 1/PAGES der Track-Breite
  let offset = -page * step + (dx / window.innerWidth) * step;
  if (offset > 0) offset *= 0.3;
  if (offset < last) offset = last + (offset - last) * 0.3;
  track.style.transform = `translateX(${offset}%)`;
  indicator.style.transform = `translateX(${Math.min((PAGES - 1) * 100, Math.max(0, -offset / step * 100))}%)`;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!dragging) return;
  dragging = false;
  const dx = e.changedTouches[0].screenX - startX;
  track.style.transition = 'transform .3s ease';
  indicator.style.transition = 'transform .3s ease';
  if (!horizontal) return;   // normales Hoch-/Runterscrollen: nichts anfassen
  if (Math.abs(dx) > window.innerWidth * 0.15) {
    if (dx < 0 && page < PAGES - 1) return show(page + 1);
    if (dx > 0 && page > 0) return show(page - 1);
  }
  show(page);   // zurückfedern auf die aktuelle Seite
}, { passive: true });
</script>
</body>
</html>
